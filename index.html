<script type="module">
import {initializeApp,deleteApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {getFirestore,collection,doc,onSnapshot,writeBatch,setDoc,deleteDoc,addDoc,query,where,orderBy,limit,getDocs} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const cfg={
  apiKey:"AIzaSyAC8PZtck53Ic5kNd9FY3uc7ePf-37eNZY",
  authDomain:"my-erp-20cd1.firebaseapp.com",
  projectId:"my-erp-20cd1",
  appId:"1:628170099108:web:be647f116bf4eeb5775931"
};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const ARR=['cust','vend','items','docs','pays','jrn','pre','users','adj','vatret'];
const COLS=[...ARR,'meta'];
let unsubs=[],last={},loaded=false,busy=false,dirty=false,timer=null,session=0;
const gS=()=>window.getS();
const META=['_cb','_ca','_mb','_ma'],strip=r=>{const o={};for(const k in r)if(!META.includes(k))o[k]=r[k];return o},cOf=j=>{try{return JSON.stringify(strip(JSON.parse(j)))}catch(e){return j}};
const nowIso=()=>new Date().toISOString(),who=()=>{try{return window.curName()}catch(e){return'System'}};
let pendingLogs=[],quiet=false;
const logE=(a,k,r,d)=>{if(quiet)return;pendingLogs.push({t:nowIso(),u:who(),a,k,ref:(r&&r.id)||'',no:(r&&(r.no||r.name||r.memo))||'',d:d||''})};
const LBL={lines:'items',party:'customer/vendor',novat:'VAT',vcat:'VAT type',st:'status',void:'cancelled',draft:'draft',terms:'terms',lpo:'LPO',amount:'amount',mode:'payment mode',name:'name',email:'email',trn:'TRN',rate:'rate',cost:'cost',limit:'credit limit',memo:'memo',date:'date',notes:'notes',no:'number'};
function changes(a,b){const o=[];new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>{if(JSON.stringify(a[k])!==JSON.stringify(b[k]))o.push(LBL[k]||k)});return o.join(', ').slice(0,160)}

function stop(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];loaded=false;clearTimeout(timer)}

function start(user){
  stop();const my=++session;
  last={meta:{}};ARR.forEach(k=>last[k]={});
  const snaps={},seen={};let pending=COLS.length,failed=false;
  COLS.forEach(c=>{
    unsubs.push(onSnapshot(collection(db,c),snap=>{
      if(my!==session)return;
      if(!loaded){snaps[c]=snap;if(!seen[c]){seen[c]=1;if(--pending===0)firstLoad(user,snaps)}}
      else apply(c,snap);
    },err=>{
      if(failed||my!==session)return;failed=true;console.error(err);
      window.lstat('noaccess',err.code==='permission-denied'?'Your email is signed in but is not allowed to open this ERP. Ask an admin to add you.':'Could not load data: '+(err.code||err.message));
    }));
  });
}

function firstLoad(user,snaps){
  const empty=COLS.every(c=>snaps[c].empty);
  if(empty){quiet=true;
    const lg=window.getLegacy();
    if(lg&&Array.isArray(lg.docs)&&confirm('Found ERP data saved in this browser. Import it into the shared online database?')){lg.cur=gS().cur;window.setS(lg);window.ensureU()}
  }else{
    const N={};
    ARR.forEach(k=>{const rows=[];snaps[k].forEach(d=>{const x=d.data();last[k][d.id]={j:x.j,o:x.o||0,c:cOf(x.j)};try{rows.push([x.o||0,JSON.parse(x.j)])}catch(e){}});rows.sort((a,b)=>a[0]-b[0]);N[k]=rows.map(r=>r[1])});
    snaps.meta.forEach(d=>{const x=d.data();last.meta[d.id]=x.j;try{N[d.id]=JSON.parse(x.j)}catch(e){}});
    if(!N.n)N.n={JV:1};

  }

  }
  if(u.off){stop();window.lstat('disabled','This account has been disabled by an admin.');return}
  loaded=true;
  window.enter(u.id);
  addDoc(collection(db,'log'),{t:nowIso(),u:u.name,a:'Signed in',k:'session',ref:'',no:email,d:''}).catch(()=>{});
  flush();
}

function cmpO(c){return(a,b)=>{const x=(last[c][a.id]||{}).o,y=(last[c][b.id]||{}).o,p=x==null?Infinity:x,q=y==null?Infinity:y;return p===q?0:p<q?-1:1}}

function apply(c,snap){
  const S=gS();let changed=false;
  if(c==='meta'){
    snap.docChanges().forEach(ch=>{
      if(ch.type==='removed')return;
      const k=ch.doc.id,j=ch.doc.data().j,prev=last.meta[k];last.meta[k]=j;
      const lj=JSON.stringify(S[k]);if(lj===j)return;if(S[k]!==undefined&&lj!==prev)return;
      try{S[k]=JSON.parse(j);changed=true}catch(e){}
    });
  }else{
    let added=false;
    snap.docChanges().forEach(ch=>{
      const id=ch.doc.id,arr=S[c]||(S[c]=[]),i=arr.findIndex(x=>x&&x.id===id),prev=last[c][id];
      if(ch.type==='removed'){delete last[c][id];if(i>=0&&prev&&JSON.stringify(arr[i])===prev.j){arr.splice(i,1);changed=true}return}
      const x=ch.doc.data();last[c][id]={j:x.j,o:x.o||0,c:cOf(x.j)};
      if(i>=0){const lj=JSON.stringify(arr[i]);if(lj===x.j)return;if(prev&&lj!==prev.j)return;try{arr[i]=JSON.parse(x.j);changed=true}catch(e){}}
      else{try{arr.push(JSON.parse(x.j));changed=true;added=true}catch(e){}}
    });
    if(added)(S[c]).sort(cmpO(c));
  }
  if(changed)window.afterRemote();
}

function diff(){
  const S=gS(),ops=[];pendingLogs=[];
  ARR.forEach(k=>{
    const arr=S[k]||[],L=last[k],ids={};
    arr.forEach((r,i)=>{
      if(!r||typeof r!=='object')return;
      if(!r.id)r.id='x'+Math.random().toString(36).slice(2,9);
      ids[r.id]=1;const cj=JSON.stringify(strip(r)),p=L[r.id];
      if(!p||p.c!==cj){
        const u=who(),n=nowIso();let a='Created',dt='';
        if(!p){if(!r._cb){r._cb=u;r._ca=n}}
        else{let pv={};try{pv=JSON.parse(p.j)}catch(e){}a=(pv.draft&&!r.draft)?'Confirmed':(!pv.void&&r.void)?'Cancelled':(pv.void&&!r.void)?'Reopened':'Edited';dt=a==='Cancelled'?(r.voidReason||''):changes(strip(pv),strip(r))}
        r._mb=u;r._ma=n;const j=JSON.stringify(r);ops.push({k,id:r.id,j,c:cj,o:p?p.o:Date.now()+i/1000});logE(a,k,r,dt);
      }
    });
    Object.keys(L).forEach(id=>{if(!ids[id]){ops.push({k,id,del:1});let pv={};try{pv=JSON.parse(L[id].j)}catch(e){}pv.id=id;logE('Deleted',k,pv,'')}});
  });
  Object.keys(S).forEach(k=>{
    if(ARR.includes(k)||k==='cur'||S[k]===undefined)return;
    const j=JSON.stringify(S[k]);if(last.meta[k]!==j){ops.push({k:'meta',id:k,j});if((k==='co'||k==='pt')&&last.meta[k]!==undefined)logE('Edited','settings',{id:k,name:k==='co'?'Company details':'Print settings'},'')}
  });
  return ops;
}

async function flush(){
  if(!loaded)return;
  if(busy){dirty=true;return}
  busy=true;
  try{
    do{
      dirty=false;const ops=diff(),lg=pendingLogs;pendingLogs=[];
      for(let i=0;i<ops.length;i+=400){
        const part=ops.slice(i,i+400),b=writeBatch(db);
        part.forEach(op=>{const r=doc(db,op.k,op.id);if(op.del)b.delete(r);else b.set(r,op.k==='meta'?{j:op.j}:{j:op.j,o:op.o})});
        await b.commit();
        part.forEach(op=>{if(op.k==='meta')last.meta[op.id]=op.j;else if(op.del)delete last[op.k][op.id];else last[op.k][op.id]={j:op.j,o:op.o,c:op.c}});
      }
      for(let i=0;i<lg.length;i+=400){try{const b=writeBatch(db);lg.slice(i,i+400).forEach(e=>b.set(doc(collection(db,'log')),e));await b.commit()}catch(e){console.error('log',e)}}
    }while(dirty);
  }catch(e){console.error(e);window.toastMsg('Could not save: '+(e.code||e.message))}
  quiet=false;busy=false;
}

  createUser:async(email,pw)=>{const s2=initializeApp(cfg,'sec'+Date.now());try{const a=getAuth(s2);await createUserWithEmailAndPassword(a,email,pw);await fbOut(a)}finally{await deleteApp(s2)}}
